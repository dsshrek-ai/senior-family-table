<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Lists | The Senior Family Table</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main><p class="muted">Loading…</p></main>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
const main = renderShell('lists.html');
let lists = [];
let showDone = false;

function tile(l) {
  const progress = l.items ? `${l.checked} of ${l.items} checked off` : 'Empty';
  return `<a class="tile" href="list.html?id=${l.id}">
    <h3>${escapeHtml(l.title)}</h3>
    <div class="meta">${progress}${l.status === 'completed' && l.completedAt ? ` · Done ${formatDateTime(l.completedAt)}` : ''}</div>
    <div style="margin-top:6px">${l.shared ? '<span class="pill">Shared</span>' : ''}${l.role !== 'owner' ? `<span class="pill muted">${ROLE_LABELS[l.role]}</span>` : ''}</div></a>`;
}

function render() {
  const active = lists.filter(l => l.status === 'active');
  const done = lists.filter(l => l.status === 'completed');
  main.innerHTML = `
    <div class="toolbar"><h1 style="margin:0">Shopping Lists</h1><span class="spacer"></span>
      <button type="button" class="btn" id="new-btn">+ New list</button></div>
    <form class="card hidden" id="new-form" novalidate>
      <label for="nl-title" style="margin-top:0">What's this list for?</label>
      <input type="text" id="nl-title" data-field="title" maxlength="150" placeholder="e.g. Weekly Groceries, Relief Society Christmas Social">
      <div class="field-error" data-for="title"></div><div class="field-error" id="nl-msg"></div>
      <div class="actions"><button type="submit" class="btn">Create</button><button type="button" class="btn secondary" id="nl-cancel">Cancel</button></div>
    </form>
    ${active.length ? `<div class="grid">${active.map(tile).join('')}</div>`
      : `<div class="card"><p>No shopping lists yet.</p><p class="muted">Make one for each purpose — weekly groceries, a party, a holiday dinner.
         Then open a recipe and choose <strong>🛒 Add to shopping list</strong>.</p></div>`}
    ${done.length ? `<p style="margin-top:20px"><button type="button" class="link-btn" id="done-toggle">${showDone ? 'Hide' : 'Show'} completed lists (${done.length})</button></p>
      ${showDone ? `<div class="grid">${done.map(tile).join('')}</div>` : ''}` : ''}`;

  const form = document.getElementById('new-form');
  document.getElementById('new-btn').addEventListener('click', () => { form.classList.remove('hidden'); document.getElementById('nl-title').focus(); });
  document.getElementById('nl-cancel').addEventListener('click', () => form.classList.add('hidden'));
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    try {
      const res = await apiPost('createList', { title: document.getElementById('nl-title').value });
      rememberList(res.id);
      window.location.href = `list.html?id=${res.id}`;
    } catch (e) { showFieldError(form, e, document.getElementById('nl-msg')); }
  });
  const toggle = document.getElementById('done-toggle');
  if (toggle) { toggle.addEventListener('click', () => { showDone = !showDone; render(); }); }
}

apiGet('listLists').then(res => { lists = res.lists; render(); }).catch(e => handleError(main, e));
</script>
</body>
</html>
