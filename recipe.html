<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe | The Senior Family Table</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main><p class="muted">Loading…</p></main>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/addtolist.js"></script>
<script src="js/recipepdf.js"></script>
<script src="js/photos.js"></script>
<script>
const main = renderShell('');
const recipeId = Number(param('id'));
const fromCookbook = Number(param('cookbook')) || null;
let r = null;
let myBooks = [];
// Scaling (§6 / REQUIREMENTS §6): servings or batches; the master recipe is never changed.
let scaleMode = 'servings';
let scaleValue = null;
let arranging = false;       // editors rearranging photos
let pendingNotePhotos = [];  // photos chosen for the note being written: { file, url }

const baseFor = mode => (mode === 'batches' ? r.yieldQuantity : r.servings);
function factor() {
  const base = baseFor(scaleMode);
  return base && scaleValue ? scaleValue / base : 1;
}
function scaleLabel() {
  if (scaleMode === 'batches') { return `${formatQuantity(scaleValue)} ${unitLabel(r.yieldUnit || 'batch', scaleValue) || 'batches'}`; }
  return `${formatQuantity(scaleValue)} serving${Number(scaleValue) === 1 ? '' : 's'}`;
}

function ingredientList(list, f = 1) {
  let html = '';
  let section = null;
  for (const i of list) {
    if ((i.section || null) !== section) {
      section = i.section || null;
      if (section) { html += `<li class="section">${escapeHtml(section)}</li>`; }
    }
    html += `<li>${escapeHtml(scaledIngredientText(i, f))}${i.optional && !/optional/i.test(i.text) ? ' <span class="opt">(optional)</span>' : ''}</li>`;
  }
  return `<ul class="ingredients">${html}</ul>`;
}

function stepsHtml() {
  const shared = r.steps.filter(s => s.methodId === null);
  let html = shared.length ? `<ol class="steps">${shared.map(s => `<li>${escapeHtml(s.text)}</li>`).join('')}</ol>` : '';
  for (const m of r.methods) {
    const ms = r.steps.filter(s => s.methodId === m.id);
    if (!ms.length) { continue; }
    html += `<h3 style="margin-top:16px">${escapeHtml(m.name)}</h3><ol class="steps">${ms.map(s => `<li>${escapeHtml(s.text)}</li>`).join('')}</ol>`;
  }
  return html || '<p class="muted">No steps yet.</p>';
}

function scaleControls() {
  if (!r.servings && !r.yieldQuantity) {
    return r.canEdit ? '<p class="hint no-print">Add servings or a batch size in the editor to scale this recipe.</p>' : '';
  }
  const unitWord = scaleMode === 'batches' ? (unitLabel(r.yieldUnit || 'batch', 2) || 'batches') : 'servings';
  return `<div class="scale no-print" role="group" aria-label="Scale this recipe">
    ${r.servings && r.yieldQuantity ? `<span class="seg"><button type="button" data-mode="servings" class="${scaleMode === 'servings' ? 'active' : ''}">Servings</button><button type="button" data-mode="batches" class="${scaleMode === 'batches' ? 'active' : ''}">Batches</button></span>` : ''}
    <span class="qty-stepper"><button type="button" class="qty-step-btn" data-step="-1" aria-label="Fewer">−</button>
      <input type="text" inputmode="decimal" id="scale-input" class="qty-input" value="${quantityToInput(scaleValue)}" aria-label="How many ${unitWord}">
      <button type="button" class="qty-step-btn" data-step="1" aria-label="More">+</button></span>
    <span>${escapeHtml(unitWord)}</span>
    <button type="button" class="link-btn" id="scale-reset">Reset</button>
    <button type="button" class="link-btn" id="scale-save">Remember this amount</button>
  </div>`;
}

function scaleNote() {
  const f = factor();
  if (Math.abs(f - 1) < 1e-9) { return ''; }
  return `<p class="banner" style="margin:10px 0">Scaled ×${formatQuantity(Math.round(f * 100) / 100)} to ${escapeHtml(scaleLabel())}. Ingredient amounts are scaled;
    <strong>cooking times, pan sizes and equipment may need adjusting by hand.</strong></p>`;
}

function renderIngredients() {
  document.getElementById('ing-list').innerHTML = (r.ingredients.length ? ingredientList(r.ingredients, factor()) : '<p class="muted">No ingredients yet.</p>');
  document.getElementById('scale-note').innerHTML = scaleNote();
}

function render() {
  document.title = `${r.title} | The Senior Family Table`;
  const facts = [
    r.servings ? `Serves ${formatQuantity(r.servings)}` : '',
    r.yieldQuantity ? `Makes ${formatQuantity(r.yieldQuantity)} ${escapeHtml(r.yieldUnit || '')}` : '',
    r.prepMinutes !== null ? `Prep ${formatMinutes(r.prepMinutes)}` : '',
    r.cookMinutes !== null ? `Cook ${formatMinutes(r.cookMinutes)}` : '',
    r.totalMinutes !== null ? `Total ${formatMinutes(r.totalMinutes)}` : '',
  ].filter(Boolean);
  const inBooks = new Set(r.cookbooks.map(c => c.id));
  const addable = myBooks.filter(b => !inBooks.has(b.id) && (b.role === 'owner' || b.role === 'editor'));
  const back = r.cookbooks.find(c => c.id === fromCookbook) || r.cookbooks[0];

  main.innerHTML = `
    <p class="no-print">${back ? `<a href="cookbook.html?id=${back.id}">← ${escapeHtml(back.title)}</a>` : '<a href="index.html">← My Cookbooks</a>'}</p>
    <div class="recipe-head card">
      <div id="hero"></div>
      <div class="toolbar" style="margin:0">
        <h1 style="margin:0;flex:1">${escapeHtml(r.title)}</h1>
        <button type="button" class="icon-btn fav no-print" id="fav" aria-pressed="${r.me.favorite}" aria-label="${r.me.favorite ? 'Remove from favorites' : 'Add to favorites'}">${r.me.favorite ? '★' : '☆'}</button>
      </div>
      ${facts.length ? `<div class="facts">${facts.map(f => `<span>${f}</span>`).join('')}</div>` : ''}
      <div>${r.tags.map(t => `<span class="pill${t.scope === 'user' ? ' muted' : ''}"${t.scope === 'user' ? ' title="Only you see this tag"' : ''}>${escapeHtml(t.name)}</span>`).join('')}
        <button type="button" class="link-btn no-print" id="tags-btn" style="margin-left:4px">${r.tags.length ? 'Edit tags' : '+ Add tags'}</button></div>
      <section class="card hidden no-print" id="tags-box" style="margin:12px 0 0;box-shadow:none" aria-label="Tags"></section>
      ${r.description ? `<div style="margin-top:12px">${formatText(r.description)}</div>` : ''}
      <div id="photos-box" class="no-print" style="margin-top:10px"></div>
      <div class="actions no-print">
        ${r.ingredients.length ? '<button type="button" class="btn" id="to-list">🛒 Add to shopping list</button>' : ''}
        ${r.canEdit ? '<button type="button" class="btn secondary" id="add-photos">📷 Add photos</button>' : ''}
        ${r.canEdit ? `<a class="btn secondary" href="recipe-edit.html?id=${r.id}${fromCookbook ? `&cookbook=${fromCookbook}` : ''}">Edit</a>` : ''}
        <a class="btn secondary" href="share.html?type=recipe&id=${r.id}">${r.canManage ? 'Share' : 'People'}</a>
        <a class="btn secondary" href="history.html?id=${r.id}">History</a>
        <button type="button" class="btn secondary" id="send-pdf" title="A PDF you can text or email to anyone — no account needed">📄 Send as PDF</button>
        <button type="button" class="btn secondary" onclick="window.print()">Print</button>
        ${r.canManage ? '<button type="button" class="btn danger" id="del">Delete</button>' : ''}
      </div>
    </div>
    <section class="card hidden no-print" id="atl-box" aria-label="Add to shopping list"></section>
    <div class="recipe-body">
      <section class="card" aria-labelledby="ing-h"><h2 id="ing-h">Ingredients</h2>
        ${scaleControls()}<div id="scale-note"></div><div id="ing-list"></div></section>
      <section class="card" aria-labelledby="steps-h"><h2 id="steps-h">Steps</h2>${stepsHtml()}</section>
    </div>
    ${r.generalNotes ? `<section class="card"><h2>Notes</h2>${formatText(r.generalNotes)}</section>` : ''}
    <section class="card${r.notes.length ? '' : ' no-print'}" aria-labelledby="notes-h"><h2 id="notes-h">Family notes</h2>
      <div id="notes-list"></div>
      <form class="no-print" id="note-form" novalidate style="margin-top:8px">
        <label for="note-text" style="margin-top:0">Add a note</label>
        <textarea id="note-text" data-field="text" rows="3" maxlength="5000" placeholder="Tips, changes you made, who loves it…"></textarea>
        <div class="field-error" data-for="text"></div>
        <div class="note-photos" id="note-pending"></div>
        <button type="button" class="link-btn" id="note-add-photo">📷 Add photos to this note</button>
        <fieldset style="border:0;padding:0;margin:8px 0 0"><legend class="muted" style="font-size:0.9rem">Who can see it</legend>
          <label class="check" style="display:inline-flex;margin-right:16px"><input type="radio" name="vis" value="shared" checked> Everyone who can see this recipe</label>
          <label class="check" style="display:inline-flex"><input type="radio" name="vis" value="private"> Only me</label></fieldset>
        <div class="actions" style="margin-top:8px"><button type="submit" class="btn small">Add note</button></div>
      </form>
    </section>
    <section class="card no-print">
      <p style="margin:0 0 8px">${r.source ? `Source: ${escapeHtml(r.source)}<br>` : ''}
        In your cookbooks: ${r.cookbooks.length ? r.cookbooks.map(c => `<a href="cookbook.html?id=${c.id}">${escapeHtml(c.title)}</a>`).join(', ') : '<span class="muted">none</span>'}</p>
      ${addable.length ? `<div class="toolbar" style="margin:0"><label for="add-book" style="margin:0">Also add to</label>
        <select id="add-book" style="width:auto;flex:1;min-width:160px">${addable.map(b => `<option value="${b.id}">${escapeHtml(b.title)}</option>`).join('')}</select>
        <button type="button" class="btn small" id="add-book-btn">Add</button></div>` : ''}
      <p class="muted" style="margin:8px 0 0;font-size:0.9rem">Version ${r.version}${r.updatedBy ? ` · last changed by ${escapeHtml(r.updatedBy.name)} ${formatDateTime(r.updatedAt)}` : ''}</p>
    </section>`;

  renderIngredients();
  wireScale();
  renderPhotos();
  renderNotes();
  wireNotes();
  document.getElementById('tags-btn').addEventListener('click', showTags);
  document.getElementById('send-pdf').addEventListener('click', ev => sendPdf(ev.currentTarget));
  const addPhotos = document.getElementById('add-photos');
  if (addPhotos) { addPhotos.addEventListener('click', () => pickPhotos(files => addRecipePhotos(files, addPhotos))); }
  const toList = document.getElementById('to-list');
  if (toList) {
    toList.addEventListener('click', () => {
      const box = document.getElementById('atl-box');
      showAddToList(box, [{ id: r.id, title: r.title, ingredients: r.ingredients, factor: factor(),
        scaleMode, scaleValue, scaleLabel: scaleValue ? scaleLabel() : '' }]);
      box.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }
  document.getElementById('fav').addEventListener('click', async () => {
    try {
      await apiPost('setFavorite', { recipeId: r.id, favorite: !r.me.favorite });
      r.me.favorite = !r.me.favorite;
      render();
    } catch (e) { toast(e.message); }
  });
  const addBtn = document.getElementById('add-book-btn');
  if (addBtn) {
    addBtn.addEventListener('click', async () => {
      const id = Number(document.getElementById('add-book').value);
      try {
        await apiPost('linkRecipe', { cookbookId: id, recipeId: r.id });
        toast('Added');
        await load();
      } catch (e) { toast(e.message); }
    });
  }
  const del = document.getElementById('del');
  if (del) {
    del.addEventListener('click', async () => {
      if (!confirm(`Delete "${r.title}"?\n\nIt disappears from every cookbook it's in, for everyone. Co-owners can restore it from My Cookbooks for 30 days.`)) { return; }
      try {
        await apiPost('deleteRecipe', { id: r.id });
        window.location.href = back ? `cookbook.html?id=${back.id}` : 'index.html';
      } catch (e) { toast(e.message); }
    });
  }
}

// ---- Photos (the first is the cover) ----------------------------------------------

const NOTE_PHOTO_MAX = 4;
const attr = s => escapeHtml(s).replace(/"/g, '&quot;');

function renderPhotos() {
  const ps = r.photos;
  const hero = document.getElementById('hero');
  const box = document.getElementById('photos-box');
  if (!ps.length) { arranging = false; }
  hero.innerHTML = ps.length ? `<button type="button" class="recipe-hero" data-view="0" aria-label="View photo${ps[0].caption ? `: ${attr(ps[0].caption)}` : ''}">
    <img src="${photoSrc(ps[0].full)}" alt="${attr(ps[0].caption || r.title)}"></button>` : '';
  let html = '';
  if (ps.length > 1 && !arranging) {
    html += `<div class="photo-strip">${ps.map((p, i) => `<button type="button" data-view="${i}" aria-label="View photo ${i + 1}${p.caption ? `: ${attr(p.caption)}` : ''}">
      <img src="${photoSrc(p.thumb)}" alt="" loading="lazy"></button>`).join('')}</div>`;
  }
  if (r.canEdit && ps.length) {
    html += `<button type="button" class="link-btn" id="arrange" aria-expanded="${arranging}">${arranging ? 'Done arranging' : 'Arrange photos'}</button>`;
  }
  if (arranging) {
    html += `<p class="hint" style="margin:6px 0 0">The first photo is the cover. Captions save when you leave the box.</p>
      <div class="photo-grid">${ps.map((p, i) => `<div class="photo-card" data-pid="${p.id}">
        <img src="${photoSrc(p.thumb)}" alt="Photo ${i + 1}">
        ${i === 0 ? '<span class="pill" style="margin-top:6px">Cover</span>' : ''}
        <input type="text" maxlength="255" data-cap placeholder="Caption (optional)" value="${attr(p.caption || '')}" aria-label="Caption for photo ${i + 1}">
        <div class="row">
          ${i > 0 ? '<button type="button" class="btn small secondary" data-first>Make cover</button>' : ''}
          <button type="button" class="btn small secondary" data-move="-1" aria-label="Move photo ${i + 1} earlier"${i === 0 ? ' disabled' : ''}>◀</button>
          <button type="button" class="btn small secondary" data-move="1" aria-label="Move photo ${i + 1} later"${i === ps.length - 1 ? ' disabled' : ''}>▶</button>
          <button type="button" class="btn small danger" data-del>Remove</button>
        </div></div>`).join('')}</div>`;
  }
  box.innerHTML = html;

  [hero, box].forEach(el => el.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => openPhotoViewer(ps, Number(b.dataset.view)))));
  const arrange = document.getElementById('arrange');
  if (arrange) { arrange.addEventListener('click', () => { arranging = !arranging; renderPhotos(); }); }
  box.querySelectorAll('[data-pid]').forEach(card => {
    const id = Number(card.dataset.pid);
    const act = async (action, payload, msg) => {
      try {
        r.photos = (await apiPost(action, { id, ...payload })).photos;
        renderPhotos();
        if (msg) { toast(msg); }
      } catch (e) { toast(e.message); }
    };
    card.querySelector('[data-cap]').addEventListener('change', async ev => {
      try {
        r.photos = (await apiPost('setPhotoCaption', { id, caption: ev.target.value })).photos;
        toast('Caption saved');
      } catch (e) { toast(e.message); }
    });
    const first = card.querySelector('[data-first]');
    if (first) { first.addEventListener('click', () => act('movePhoto', { first: true }, 'Cover changed')); }
    card.querySelectorAll('[data-move]').forEach(b => b.addEventListener('click', () => act('movePhoto', { direction: Number(b.dataset.move) })));
    card.querySelector('[data-del]').addEventListener('click', () => {
      if (!confirm('Remove this photo from the recipe, for everyone?')) { return; }
      act('deletePhoto', {}, 'Photo removed');
    });
  });
}

async function addRecipePhotos(files, btn) {
  const label = btn.textContent;
  btn.disabled = true;
  let added = 0;
  for (let k = 0; k < files.length; k++) {
    btn.textContent = files.length > 1 ? `Adding ${k + 1} of ${files.length}…` : 'Adding photo…';
    try {
      r.photos = (await uploadPhoto('uploadRecipePhoto', { recipeId: r.id }, files[k])).photos;
      added++;
      renderPhotos();
    } catch (e) { toast(e.message); }
  }
  btn.textContent = label;
  btn.disabled = false;
  if (added) { toast(added === 1 ? 'Photo added' : `${added} photos added`); }
}

// Photos chosen for a note that hasn't been saved yet.
function renderPendingNotePhotos() {
  const box = document.getElementById('note-pending');
  box.innerHTML = pendingNotePhotos.map((x, i) => `<span class="np"><img src="${x.url}" alt="Chosen photo ${i + 1}">
    <button type="button" class="rm" data-unpick="${i}" aria-label="Don't add photo ${i + 1}">✕</button></span>`).join('');
  box.querySelectorAll('[data-unpick]').forEach(b => b.addEventListener('click', () => {
    const [gone] = pendingNotePhotos.splice(Number(b.dataset.unpick), 1);
    URL.revokeObjectURL(gone.url);
    renderPendingNotePhotos();
  }));
  document.getElementById('note-add-photo').classList.toggle('hidden', pendingNotePhotos.length >= NOTE_PHOTO_MAX);
}
function clearPendingNotePhotos() {
  pendingNotePhotos.forEach(x => URL.revokeObjectURL(x.url));
  pendingNotePhotos = [];
  renderPendingNotePhotos();
}

// While editing your own note: remove photos or add more (saved straight away).
function renderEditNotePhotos(box, n) {
  box.innerHTML = `<div class="note-photos">${n.photos.map((p, i) => `<span class="np"><img src="${photoSrc(p.thumb)}" alt="Photo ${i + 1}">
      <button type="button" class="rm" data-rm="${p.id}" aria-label="Remove photo ${i + 1}">✕</button></span>`).join('')}</div>
    ${n.photos.length < NOTE_PHOTO_MAX ? '<button type="button" class="link-btn" data-add-np>📷 Add a photo</button>' : ''}`;
  box.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Remove this photo from your note?')) { return; }
    try {
      Object.assign(n, (await apiPost('deleteNotePhoto', { id: Number(b.dataset.rm) })).note);
      renderEditNotePhotos(box, n);
    } catch (e) { toast(e.message); }
  }));
  const add = box.querySelector('[data-add-np]');
  if (add) {
    add.addEventListener('click', () => pickPhotos(async files => {
      for (const file of files.slice(0, NOTE_PHOTO_MAX - n.photos.length)) {
        add.textContent = 'Adding photo…';
        try { Object.assign(n, (await uploadPhoto('uploadNotePhoto', { noteId: n.id }, file)).note); } catch (e) { toast(e.message); }
      }
      renderEditNotePhotos(box, n);
    }));
  }
}

// ---- Family notes -------------------------------------------------------------

function noteHtml(n) {
  const canRemove = n.mine || (r.canManage && n.visibility === 'shared');
  return `<div class="note${n.visibility === 'private' ? ' private' : ''}" data-note="${n.id}">
    <div class="note-body">${formatText(n.text)}</div>
    ${n.photos && n.photos.length ? `<div class="note-photos">${n.photos.map((p, i) => `<button type="button" class="view" data-np="${i}" aria-label="View photo ${i + 1}"><img src="${photoSrc(p.thumb)}" alt="" loading="lazy"></button>`).join('')}</div>` : ''}
    <div class="by">${escapeHtml(n.author.name)} · ${formatDateTime(n.createdAt)}${n.updatedAt !== n.createdAt ? ' (edited)' : ''}
      ${n.visibility === 'private' ? ' · <strong>Private — only you can see this</strong>' : ''}
      ${n.mine ? ' · <button type="button" class="link-btn no-print" data-note-edit>Edit</button>' : ''}
      ${canRemove ? ` · <button type="button" class="link-btn no-print" data-note-del>${n.mine ? 'Delete' : 'Remove'}</button>` : ''}</div>
  </div>`;
}

function renderNotes() {
  const box = document.getElementById('notes-list');
  box.innerHTML = r.notes.length ? r.notes.map(noteHtml).join('') : '<p class="muted no-print" style="margin:0">No notes yet.</p>';
  box.querySelectorAll('[data-note]').forEach(el => {
    const n = r.notes.find(x => x.id === Number(el.dataset.note));
    el.querySelectorAll('[data-np]').forEach(b => b.addEventListener('click', () => openPhotoViewer(n.photos, Number(b.dataset.np))));
    const del = el.querySelector('[data-note-del]');
    if (del) {
      del.addEventListener('click', async () => {
        if (!confirm(n.mine ? 'Delete your note?' : `Remove ${n.author.name}'s note for everyone?`)) { return; }
        try {
          await apiPost('deleteNote', { id: n.id });
          r.notes = r.notes.filter(x => x !== n);
          renderNotes();
        } catch (e) { toast(e.message); }
      });
    }
    const edit = el.querySelector('[data-note-edit]');
    if (edit) {
      edit.addEventListener('click', () => {
        el.innerHTML = `<textarea rows="3" maxlength="5000" aria-label="Edit note">${escapeHtml(n.text)}</textarea>
          <div class="edit-photos"></div>
          <label class="check" style="margin:6px 0"><input type="checkbox"${n.visibility === 'private' ? ' checked' : ''}> Only me</label>
          <div class="actions" style="margin-top:6px"><button type="button" class="btn small" data-save>Save</button>
            <button type="button" class="btn small secondary" data-cancel>Cancel</button></div>`;
        const save = el.querySelector('[data-save]');
        const cancel = el.querySelector('[data-cancel]');
        renderEditNotePhotos(el.querySelector('.edit-photos'), n);
        el.querySelector('textarea').focus();
        cancel.addEventListener('click', renderNotes);
        save.addEventListener('click', async () => {
          try {
            const res = await apiPost('updateNote', { id: n.id, text: el.querySelector('textarea').value,
              visibility: el.querySelector('input[type="checkbox"]').checked ? 'private' : 'shared' });
            Object.assign(n, res.note);
            renderNotes();
          } catch (e) { toast(e.message); }
        });
      });
    }
  });
}

function wireNotes() {
  const form = document.getElementById('note-form');
  renderPendingNotePhotos();
  document.getElementById('note-add-photo').addEventListener('click', () => pickPhotos(files => {
    const room = NOTE_PHOTO_MAX - pendingNotePhotos.length;
    if (files.length > room) { toast(`A note can have up to ${NOTE_PHOTO_MAX} photos`); }
    for (const file of files.slice(0, Math.max(0, room))) { pendingNotePhotos.push({ file, url: URL.createObjectURL(file) }); }
    renderPendingNotePhotos();
  }));
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    try {
      const res = await apiPost('addNote', { recipeId: r.id, text: document.getElementById('note-text').value,
        visibility: form.querySelector('input[name="vis"]:checked').value });
      const note = res.note;
      r.notes.push(note);
      document.getElementById('note-text').value = '';
      form.querySelectorAll('.field-error').forEach(e => { e.textContent = ''; });
      const files = pendingNotePhotos.map(x => x.file);
      clearPendingNotePhotos();
      let failed = 0;
      for (let k = 0; k < files.length; k++) {
        btn.textContent = `Adding photo ${k + 1} of ${files.length}…`;
        try { Object.assign(note, (await uploadPhoto('uploadNotePhoto', { noteId: note.id }, files[k])).note); } catch (e) { failed++; toast(e.message); }
      }
      btn.textContent = 'Add note';
      renderNotes();
      if (!failed) { toast(note.visibility === 'private' ? 'Private note added' : 'Note added'); }
    } catch (e) {
      showFieldError(form, e, null);
    }
    btn.disabled = false;
  });
}

// ---- Tags -------------------------------------------------------------------

async function showTags() {
  const box = document.getElementById('tags-box');
  box.classList.remove('hidden');
  box.innerHTML = '<p class="muted">Loading tags…</p>';
  let c;
  try { c = await apiGet('tagChoices', { recipeId: r.id }); } catch (e) { box.textContent = e.message; return; }
  const boxes = (tags, enabled) => tags.map(t => `<label class="check" style="display:inline-flex;margin:4px 14px 4px 0">
    <input type="checkbox" data-tag="${t.id}"${t.on ? ' checked' : ''}${enabled ? '' : ' disabled'}> ${escapeHtml(t.name)}</label>`).join('');
  const kinds = [['category', 'Categories'], ['method', 'Cooking methods'], ['descriptor', 'Descriptions']];
  // Cookbooks can hold hundreds of tags (the Senior Family Cookbook has ~240), so a group shows
  // only the tags already on this recipe, plus a box to find others or add a new one.
  const groups = [
    ...c.cookbooks.filter(b => b.canEdit || b.tags.some(t => t.on)).map(b => ({
      key: `b${b.id}`, scope: 'cookbook', cookbookId: b.id, canEdit: b.canEdit, tags: b.tags,
      title: `${escapeHtml(b.title)} tags <span class="muted" style="font-weight:normal">— everyone in that cookbook sees these</span>`,
    })),
    { key: 'mine', scope: 'user', cookbookId: null, canEdit: true, tags: c.mine,
      title: 'My tags <span class="muted" style="font-weight:normal">— only you see these</span>' },
  ];
  const groupHtml = g => `<p style="margin:14px 0 0;font-weight:600">${g.title}</p>
    <div>${boxes(g.tags.filter(t => t.on), g.canEdit) || '<span class="muted">None on this recipe.</span>'}</div>
    ${g.canEdit ? `<input type="search" maxlength="80" data-find="${g.key}" placeholder="Find or add a tag…" aria-label="Find or add a tag" style="margin-top:6px">
      <div data-matches="${g.key}"></div>` : ''}`;
  box.innerHTML = `
    <h3 style="margin-bottom:4px">Tags</h3>
    ${kinds.map(([k, label]) => `<p style="margin:10px 0 0;font-weight:600">${label}</p>${boxes(c.builtIn.filter(t => t.kind === k), c.canEditBuiltIn)}`).join('')}
    ${c.canEditBuiltIn ? '' : '<p class="hint">Only people who can edit this recipe can change these.</p>'}
    ${groups.map(groupHtml).join('')}
    <div class="actions"><button type="button" class="btn small" id="tags-done">Done</button></div>`;

  // One handler for every tick box, including ones that appear while searching.
  box.addEventListener('change', async ev => {
    const cb = ev.target;
    if (!cb.dataset || !cb.dataset.tag) { return; }
    try {
      await apiPost('setRecipeTag', { recipeId: r.id, tagId: Number(cb.dataset.tag), on: cb.checked });
      const t = [...c.builtIn, ...c.mine, ...c.cookbooks.flatMap(b => b.tags)].find(x => x.id === Number(cb.dataset.tag));
      if (t) { t.on = cb.checked; }
    } catch (e) { cb.checked = !cb.checked; toast(e.message); }
  });
  for (const g of groups) {
    const input = box.querySelector(`[data-find="${g.key}"]`);
    if (!input) { continue; }
    const out = box.querySelector(`[data-matches="${g.key}"]`);
    const addNew = async () => {
      const name = input.value.trim();
      if (!name) { return; }
      try {
        const payload = { name, scope: g.scope };
        if (g.cookbookId) { payload.cookbookId = g.cookbookId; }
        const res = await apiPost('createTag', payload);
        await apiPost('setRecipeTag', { recipeId: r.id, tagId: res.tag.id, on: true });
        toast(`Tagged "${res.tag.name}"`);
        showTags();
      } catch (e) { toast(e.message); }
    };
    input.addEventListener('input', () => {
      const term = input.value.trim().toLowerCase();
      if (!term) { out.innerHTML = ''; return; }
      const matches = g.tags.filter(t => !t.on && t.name.toLowerCase().includes(term)).slice(0, 12);
      const exact = g.tags.some(t => t.name.toLowerCase() === term);
      out.innerHTML = boxes(matches, true)
        + (exact ? '' : `<button type="button" class="btn small secondary" data-add-new style="margin-top:6px">+ Add "${escapeHtml(input.value.trim())}"</button>`);
      const btn = out.querySelector('[data-add-new]');
      if (btn) { btn.addEventListener('click', addNew); }
    });
    input.addEventListener('keydown', ev => {
      if (ev.key !== 'Enter') { return; }
      ev.preventDefault();
      const first = out.querySelector('[data-tag]');
      if (first && !first.checked) { first.checked = true; first.dispatchEvent(new Event('change', { bubbles: true })); }
      else { addNew(); }
    });
  }
  document.getElementById('tags-done').addEventListener('click', () => load());
}

// ---- Send as PDF ----------------------------------------------------------------

async function sendPdf(btn) {
  btn.disabled = true;
  const label = btn.textContent;
  btn.textContent = 'Making PDF…';
  try {
    const scaled = Math.abs(factor() - 1) > 1e-9;
    const cover = r.photos.length ? { data: await photoDataUrl(r.photos[0].full), width: r.photos[0].width, height: r.photos[0].height } : null;
    const result = await sendRecipePdf(r, factor(), scaled ? scaleLabel() : '', cover && cover.data ? cover : null);
    if (result === 'downloaded') { toast('PDF downloaded — attach it to a text or email'); }
  } catch (e) {
    toast(e.message || 'Couldn\'t make the PDF');
  }
  btn.textContent = label;
  btn.disabled = false;
}

function wireScale() {
  const input = document.getElementById('scale-input');
  if (!input) { return; }
  const apply = v => {
    if (!(v > 0)) { return; }
    scaleValue = Math.round(v * 1000) / 1000;
    input.value = quantityToInput(scaleValue);
    renderIngredients();
  };
  input.addEventListener('change', () => {
    const v = parseFraction(input.value);
    if (v > 0) { apply(v); } else { input.value = quantityToInput(scaleValue); }
  });
  main.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => apply(Math.max(1, (scaleValue || 0) + Number(b.dataset.step)))));
  main.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
    scaleMode = b.dataset.mode;
    scaleValue = baseFor(scaleMode);
    render();
  }));
  document.getElementById('scale-reset').addEventListener('click', () => {
    scaleValue = baseFor(scaleMode);
    input.value = quantityToInput(scaleValue);
    renderIngredients();
  });
  document.getElementById('scale-save').addEventListener('click', async () => {
    try {
      await apiPost('setSavedScale', { recipeId: r.id, mode: scaleMode, value: scaleValue });
      toast(`Remembered: ${scaleLabel()}`);
    } catch (e) { toast(e.message); }
  });
}

async function load() {
  const [rec, books] = await Promise.all([apiGet('getRecipe', { id: recipeId }), apiGet('listCookbooks')]);
  r = rec.recipe;
  myBooks = books.cookbooks.filter(b => !b.archived);
  // Start at this person's remembered amount, else as written.
  scaleMode = r.me.savedScaleMode === 'batches' && r.yieldQuantity ? 'batches' : (r.servings ? 'servings' : (r.yieldQuantity ? 'batches' : 'servings'));
  scaleValue = r.me.savedScale && r.me.savedScaleMode === scaleMode ? r.me.savedScale : baseFor(scaleMode);
  render();
}

load().catch(e => handleError(main, e));
