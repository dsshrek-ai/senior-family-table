<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cookbooks | The Senior Family Table</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main><p class="muted">Loading…</p></main>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
const main = renderShell('index.html');
let books = [];
let deleted = [];
let showArchived = false;

function tile(b) {
  const count = `${b.recipeCount} recipe${b.recipeCount === 1 ? '' : 's'}`;
  const tags = [b.shared ? '<span class="pill">Shared</span>' : '', b.role !== 'owner' ? `<span class="pill muted">${ROLE_LABELS[b.role]}</span>` : '',
    b.archived ? '<span class="pill muted">Archived</span>' : ''].join('');
  return `<a class="tile${b.archived ? ' archived' : ''}" href="cookbook.html?id=${b.id}">
    <h3>${escapeHtml(b.title)}</h3>
    <div class="meta">${count}</div>
    ${b.description ? `<p class="muted" style="margin:6px 0 0">${escapeHtml(b.description)}</p>` : ''}
    <div style="margin-top:6px">${tags}</div></a>`;
}

function render() {
  const active = books.filter(b => !b.archived);
  const archived = books.filter(b => b.archived);
  main.innerHTML = `
    <div class="toolbar">
      <h1 style="margin:0">My Cookbooks</h1><span class="spacer"></span>
      <button type="button" class="btn" id="new-btn">+ New cookbook</button>
    </div>
    <form class="card hidden" id="new-form" novalidate>
      <h2>New cookbook</h2>
      <label for="nb-title">Name</label>
      <input type="text" id="nb-title" data-field="title" maxlength="150" placeholder="e.g. Freezer Meals">
      <div class="field-error" data-for="title"></div>
      <label for="nb-desc">Description <span class="muted">(optional)</span></label>
      <input type="text" id="nb-desc" data-field="description" maxlength="2000">
      <div class="field-error" id="nb-msg"></div>
      <div class="actions"><button type="submit" class="btn">Create</button>
        <button type="button" class="btn secondary" id="nb-cancel">Cancel</button></div>
    </form>
    ${active.length ? `<div class="grid">${active.map(tile).join('')}</div>`
      : '<div class="card"><p>You don\'t have any cookbooks yet. Create one, or ask someone in the family to share theirs with you.</p></div>'}
    ${archived.length ? `<p style="margin-top:20px"><button type="button" class="link-btn" id="arch-toggle">${showArchived ? 'Hide' : 'Show'} archived cookbooks (${archived.length})</button></p>
      ${showArchived ? `<div class="grid">${archived.map(tile).join('')}</div>` : ''}` : ''}
    ${deleted.length ? `<div class="card" style="margin-top:20px"><h3>Recently deleted recipes</h3>
      <p class="muted">Deleted recipes can be brought back for 30 days.</p>
      <ul class="recipe-list">${deleted.map(r => `<li><span style="flex:1;padding:10px 4px">${escapeHtml(r.title)}
        <span class="sub">Deleted ${formatDateTime(r.deletedAt)}</span></span>
        <button type="button" class="btn small secondary" data-restore="${r.id}">Restore</button></li>`).join('')}</ul></div>` : ''}`;

  const form = document.getElementById('new-form');
  document.getElementById('new-btn').addEventListener('click', () => {
    form.classList.remove('hidden');
    document.getElementById('nb-title').focus();
  });
  document.getElementById('nb-cancel').addEventListener('click', () => form.classList.add('hidden'));
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    try {
      const res = await apiPost('createCookbook', {
        title: document.getElementById('nb-title').value, description: document.getElementById('nb-desc').value,
      });
      window.location.href = `cookbook.html?id=${res.id}`;
    } catch (e) {
      showFieldError(form, e, document.getElementById('nb-msg'));
      btn.disabled = false;
    }
  });
  const toggle = document.getElementById('arch-toggle');
  if (toggle) { toggle.addEventListener('click', () => { showArchived = !showArchived; render(); }); }
  main.querySelectorAll('[data-restore]').forEach(b => b.addEventListener('click', async () => {
    b.disabled = true;
    try {
      await apiPost('restoreRecipe', { id: Number(b.dataset.restore) });
      toast('Recipe restored');
      await load();
    } catch (e) {
      toast(e.message);
      b.disabled = false;
    }
  }));
}

async function load() {
  const [list, del] = await Promise.all([apiGet('listCookbooks'), apiGet('deletedRecipes')]);
  books = list.cookbooks;
  deleted = del.recipes;
  render();
}

load().catch(e => handleError(main, e));
</script>
</body>
</html>
